id: endfb_viii0_openmc
title: ENDF/B-VIII.0 nuclear and atomic data library in OpenMC HDF5 format (official OpenMC data library,
  NJOY-processed), photoatomic and atomic-relaxation sublibraries used
citation: 'D. A. Brown et al., "ENDF/B-VIII.0: The 8th Major Release of the Nuclear Reaction Data Library with
  CIELO-project Cross Sections, New Standards and Thermal Scattering Data", Nucl. Data Sheets 148, 1-142 (2018).
  Library processed and distributed by the OpenMC project (https://openmc.org/data/, "Official Data
  Libraries", ENDF/B-VIII.0). Transport code: P. K. Romano et al., "OpenMC: A state-of-the-art Monte Carlo code
  for research and development", Ann. Nucl. Energy 82, 90-97 (2015); version 0.16.0 (conda-forge).'
data_class: P1
retrieval_method: one bulk download of the official archive linked from https://openmc.org/data/ (ENDF/B-VIII.0,
  "Official Data Libraries", .tar.xz link), resumable HTTP (curl -C -), inside WSL Ubuntu-24.04. SHA-256 and
  MD5 computed over the complete archive; only the photon/ directory and cross_sections.xml were extracted for
  the photon physics. OpenMC 0.16.0 also reads incident-neutron files for every nuclide of a material even in a
  photon-only fixed-source run, so the neutron files of the nuclides of the MC materials (68 files, elements Pb
  Ir Hf O Bi F La Pr Sb Pd Os I Tl Au) were extracted from the same archive; they are loaded but never sampled
  (the source emits photons only). Script - src/shieldmap/analysis4/mc/wsl_get_endf.sh and
  wsl_get_neutron_stubs.sh.
