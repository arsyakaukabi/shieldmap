notes:
- Absolute emission intensity per decay = RI x NR x BR / 100 (ENSDF normalization rule; PN NRBR overrides
  when present). Uncertainties combined in quadrature, correlations ignored.
- lines_used = the handover lines [661.657] keV, at ENSDF's own energies. ENSDF energies equal the nominal
  values.
- Only ENSDF G (gamma) records are included. X-rays (e.g. Ba K x-rays following 137Cs decay, Ni K x-rays
  following 60Co decay) are not G records and are not included (see reports/phase1/wave1_C_references.md).
